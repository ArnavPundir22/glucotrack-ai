<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>

  <!-- Blood Droplet / Pulse Icon -->
  <g filter="url(#dropShadow)">
    <path d="M 256 70 C 256 70 128 240 128 330 C 128 400 185 450 256 450 C 327 450 384 400 384 330 C 384 240 256 70 256 70 Z" fill="url(#dropGrad)" />
  </g>

  <!-- ECG Pulse line inside droplet -->
  <path d="M 180 340 L 215 340 L 230 300 L 250 380 L 270 315 L 285 340 L 332 340" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Gemini Sparkle Star -->
  <path d="M 370 110 Q 370 140 400 140 Q 370 140 370 170 Q 370 140 340 140 Q 370 140 370 110 Z" fill="url(#aiGrad)" />
</svg>
